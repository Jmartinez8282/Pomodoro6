name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight; no point burning minutes on a commit
# nobody is waiting for any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    # A hung step otherwise burns GitHub's 6-hour default before anyone notices.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Run as separate steps rather than one chained command so a failure
      # names itself in the GitHub UI instead of surfacing as "npm exited 1".
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Cheap guardrail for the mistake that would matter most: NEXT_PUBLIC_ is
      # inlined into the client bundle, so a credential with that prefix is
      # published to every visitor.
      - name: Check for secrets exposed via NEXT_PUBLIC_
        run: |
          if grep -rInE 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|TOKEN|PASSWORD|PRIVATE|_KEY)\b' \
               --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.yml' . ; then
            echo "::error::A NEXT_PUBLIC_ variable looks like a credential. Client env vars are public."
            exit 1
          fi

      - name: Unit tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Playwright's own image, with the browsers and their system libraries
    # already installed. Installing them at runtime instead meant a ~300MB
    # download plus an `apt-get` that stalled for 7-20 minutes on this runner
    # image, intermittently and for reasons entirely outside this repo. The tag
    # must track @playwright/test in package.json — a mismatch is refused at
    # startup rather than silently running the wrong browsers.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Makes the comment above enforceable rather than aspirational: bumping
      # @playwright/test without bumping the container tag would otherwise run
      # the tests against whatever browsers the old image happens to carry.
      - name: Verify container matches @playwright/test
        run: |
          expected=$(node -p 'require("@playwright/test/package.json").version')
          actual=$(npx playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$expected" != "$actual" ]; then
            echo "::error::Container has Playwright $actual but package.json pins $expected. Update the container image tag in this workflow."
            exit 1
          fi
          echo "Playwright $actual matches package.json"

      # Includes axe-core scans of every route in both themes, a 320px overflow
      # check, and the assertion that no analytics request fires before consent.
      - name: Run Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
